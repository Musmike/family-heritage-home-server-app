services:
  db-prod:
    image: postgres:15-alpine
    container_name: family-heritage-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    container_name: family-heritage-backend-prod
    image: ghcr.io/musmike/family-heritage-backend:latest
    ports:
      - "8080:8080"
    depends_on:
      - db-prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-prod:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  frontend:
    container_name: family-heritage-frontend-prod
    image: ghcr.io/musmike/family-heritage-frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data_prod: