services:
  db-staging:
    image: postgres:15-alpine
    container_name: family-heritage-db-staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
    restart: unless-stopped
  backend:
    container_name: family-heritage-backend-staging
    image: ghcr.io/${GITHUB_REPOSITORY}/family-heritage-backend:${BACKEND_IMAGE_TAG}
    ports:
      - "8081:8080"
    volumes:
      - ./media:/media
    depends_on:
      - db-staging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-staging:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: staging
      STAGING_SERVER_IP: ${STAGING_SERVER_IP}
    restart: unless-stopped
  frontend:
    container_name: family-heritage-frontend-staging
    image: ghcr.io/${GITHUB_REPOSITORY}/family-heritage-frontend:${FRONTEND_IMAGE_TAG}
    ports:
      - "3001:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - backend