name: CD Pipeline - Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish-prod:
    name: Build and Publish Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Release Version
        run: echo "RELEASE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner,, }}/family-heritage-backend:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ github.repository_owner,, }}/family-heritage-backend:latest
            
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner,, }}/family-heritage-frontend:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ github.repository_owner,, }}/family-heritage-frontend:latest

  deploy-to-production:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-publish-prod

    steps:
      - name: Deploy to Mini PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Przechodzimy do folderu z aplikacją produkcyjną
            cd ~/family-heritage-prod

            # Tworzymy plik .env z nowymi tagami obrazów (używamy taga 'latest')
            echo "BACKEND_IMAGE_TAG=latest" > .env
            echo "FRONTEND_IMAGE_TAG=latest" >> .env

            # Dodajemy resztę zmiennych produkcyjnych
            echo "POSTGRES_USER=family_heritage_user_prod" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}" >> .env
            echo "POSTGRES_DB=family_heritage_db_prod" >> .env

            # Logujemy się do GitHub Container Registry
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Pobieramy najnowsze obrazy oznaczone jako 'latest'
            docker-compose -f docker-compose.prod.yml pull

            # Uruchamiamy aplikację w tle
            docker-compose -f docker-compose.prod.yml up -d
