name: CD Pipeline - Deploy to Production
on:
  push:
    tags: [ 'v*' ]
jobs:
  build-and-publish-prod:
    name: Build and Publish Production Images
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      repo_lc: ${{ steps.set_repo_lc.outputs.repo_lc }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - run: echo "RELEASE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Set repository name to lowercase
        id: set_repo_lc
        run: echo "repo_lc=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.set_repo_lc.outputs.repo_lc }}/family-heritage-backend:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ steps.set_repo_lc.outputs.repo_lc }}/family-heritage-backend:latest
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.set_repo_lc.outputs.repo_lc }}/family-heritage-frontend:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ steps.set_repo_lc.outputs.repo_lc }}/family-heritage-frontend:latest
  deploy-to-production:
    name: Deploy to Production Server
    runs-on: self-hosted
    needs: build-and-publish-prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          DEPLOY_PATH=/mnt/onedrive-data/family_heritage_prod
          mkdir -p $DEPLOY_PATH
          cp docker-compose.prod.yml $DEPLOY_PATH/docker-compose.prod.yml
          cd $DEPLOY_PATH

          echo "BACKEND_IMAGE_TAG=latest" > .env
          echo "FRONTEND_IMAGE_TAG=latest" >> .env
          echo "POSTGRES_USER=family_heritage_user_prod" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}" >> .env
          echo "POSTGRES_DB=family_heritage_db_prod" >> .env
          echo "VITE_API_BASE_URL=http://${{ secrets.PROD_SERVER_IP }}:8082" >> .env
          echo "PROD_SERVER_IP=${{ secrets.PROD_SERVER_IP }}" >> .env
          echo "GITHUB_REPOSITORY=${{ needs.build-and-publish-prod.outputs.repo_lc }}" >> .env

          docker compose --env-file .env -f docker-compose.prod.yml pull
          docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans