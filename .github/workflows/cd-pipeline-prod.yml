name: CD Pipeline - Deploy to Production
on:
  push:
    tags: [ 'v*' ]
jobs:
  build-and-publish-prod:
    name: Build and Publish Production Images
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Generate Docker meta for Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/family-heritage-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Generate Docker meta for Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/family-heritage-frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
  deploy-to-production:
    name: Deploy to Production Server
    runs-on: self-hosted
    needs: build-and-publish-prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          DEPLOY_PATH=/mnt/onedrive-data/family_heritage_prod
          mkdir -p $DEPLOY_PATH
          cp docker-compose.prod.yml $DEPLOY_PATH/docker-compose.prod.yml
          cd $DEPLOY_PATH
          echo "BACKEND_IMAGE_TAG=latest" > .env
          echo "FRONTEND_IMAGE_TAG=latest" >> .env
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env
          echo "POSTGRES_USER=family_heritage_user_prod" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}" >> .env
          echo "POSTGRES_DB=family_heritage_db_prod" >> .env
          echo "VITE_API_BASE_URL=http://${{ secrets.PROD_SERVER_IP }}:8082" >> .env
          echo "PROD_SERVER_IP=${{ secrets.PROD_SERVER_IP }}" >> .env
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans