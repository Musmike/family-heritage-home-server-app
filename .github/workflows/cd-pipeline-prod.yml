# .github/workflows/cd-pipeline-prod.yml

name: CD Pipeline - Deploy to Production

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish-prod:
    name: Build and Publish Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set Release Version
        run: echo "RELEASE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
        
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ tolower(github.repository_owner) }}/family-heritage-backend:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ tolower(github.repository_owner) }}/family-heritage-backend:latest
            
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ tolower(github.repository_owner) }}/family-heritage-frontend:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ tolower(github.repository_owner) }}/family-heritage-frontend:latest

  deploy-to-production:
    name: Deploy to Production Server
    runs-on: self-hosted
    needs: build-and-publish-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Production
        run: |
          DEPLOY_PATH=/mnt/onedrive-data/family_heritage_prod
          mkdir -p $DEPLOY_PATH
          
          cp docker-compose.prod.yml $DEPLOY_PATH/docker-compose.prod.yml

          cd $DEPLOY_PATH
          
          echo "BACKEND_IMAGE_TAG=latest" > .env
          echo "FRONTEND_IMAGE_TAG=latest" >> .env
          echo "POSTGRES_USER=family_heritage_user_prod" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}" >> .env
          echo "POSTGRES_DB=family_heritage_db_prod" >> .env

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans