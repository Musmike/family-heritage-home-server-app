name: CD Pipeline - Deploy to Production
on:
  push:
    tags: [ 'v*' ]
jobs:
  build-and-publish-prod:
    name: Build and Publish Production Images
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      backend_tags: ${{ steps.prepare_tags.outputs.backend_tags }}
      frontend_tags: ${{ steps.prepare_tags.outputs.frontend_tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Prepare image tags
        id: prepare_tags
        run: |
          REPO_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          VERSION=${{ github.ref_name }}
          echo "backend_tags=${{ format('ghcr.io/{0}/family-heritage-backend:{1}\nghcr.io/{0}/family-heritage-backend:latest', REPO_LC, VERSION) }}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${{ format('ghcr.io/{0}/family-heritage-frontend:{1}\nghcr.io/{0}/family-heritage-frontend:latest', REPO_LC, VERSION) }}" >> $GITHUB_OUTPUT
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.prepare_tags.outputs.backend_tags }}
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.prepare_tags.outputs.frontend_tags }}
  deploy-to-production:
    name: Deploy to Production Server
    runs-on: self-hosted
    needs: build-and-publish-prod
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          DEPLOY_PATH=/mnt/onedrive-data/family_heritage_prod
          mkdir -p $DEPLOY_PATH
          cp docker-compose.prod.yml $DEPLOY_PATH/docker-compose.prod.yml
          cd $DEPLOY_PATH
          REPO_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/$REPO_LC/family-heritage-backend:latest" > .env
          echo "FRONTEND_IMAGE=ghcr.io/$REPO_LC/family-heritage-frontend:latest" >> .env
          echo "POSTGRES_USER=family_heritage_user_prod" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}" >> .env
          echo "POSTGRES_DB=family_heritage_db_prod" >> .env
          echo "VITE_API_BASE_URL=http://${{ secrets.PROD_SERVER_IP }}:8082" >> .env
          echo "PROD_SERVER_IP=${{ secrets.PROD_SERVER_IP }}" >> .env
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans