name: CD Pipeline - Build, Publish and Deploy to Staging

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/family-heritage-backend:${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/family-heritage-frontend:${{ github.sha }}

  deploy-to-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
      - name: Deploy to Mini PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Przechodzimy do folderu z aplikacją na serwerze
            cd ~/family-heritage-home-server-app

            # Tworzymy lub aktualizujemy plik .env z nowymi tagami obrazów
            echo "BACKEND_IMAGE_TAG=${{ github.sha }}" > .env
            echo "FRONTEND_IMAGE_TAG=${{ github.sha }}" >> .env

            # Dodajemy resztę zmiennych (możesz je też trzymać w osobnym, stałym pliku .env.prod)
            echo "POSTGRES_USER=family_heritage_user" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "POSTGRES_DB=family_heritage_db" >> .env

            # Logujemy się do GitHub Container Registry na serwerze
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Pobieramy najnowsze obrazy
            docker-compose pull

            # Uruchamiamy aplikację w tle
            docker-compose up -d
