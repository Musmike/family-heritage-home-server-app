# .github/workflows/cd-pipeline.yml

name: CD Pipeline - Build, Publish and Deploy to Staging

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/family-heritage-backend:${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/family-heritage-frontend:${{ github.sha }}

  deploy-to-staging:
    name: Deploy to Staging Server
    runs-on: self-hosted
    needs: build-and-publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          DEPLOY_PATH=/mnt/onedrive-data/family_heritage_staging
          
          mkdir -p $DEPLOY_PATH

          cp docker-compose.staging.yml $DEPLOY_PATH/docker-compose.staging.yml
          
          cd $DEPLOY_PATH

          echo "BACKEND_IMAGE_TAG=${{ github.sha }}" > .env
          echo "FRONTEND_IMAGE_TAG=${{ github.sha }}" >> .env
          echo "POSTGRES_USER=family_heritage_user_staging" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD_STAGING }}" >> .env
          echo "POSTGRES_DB=family_heritage_db_staging" >> .env

          docker compose -f docker-compose.staging.yml pull
          docker compose -f docker-compose.staging.yml up -d --remove-orphans