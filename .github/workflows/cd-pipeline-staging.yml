name: CD Pipeline - Build, Publish and Deploy to Staging
on:
  push:
    branches: [ "develop" ]
jobs:
  build-and-publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      backend_image: ${{ steps.prepare_tags.outputs.backend_image }}
      frontend_image: ${{ steps.prepare_tags.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Prepare image tags
        id: prepare_tags
        run: |
          REPO_LC=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          echo "backend_image=${{ format('ghcr.io/{0}/family-heritage-backend:{1}', REPO_LC, github.sha) }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ format('ghcr.io/{0}/family-heritage-frontend:{1}', REPO_LC, github.sha) }}" >> $GITHUB_OUTPUT
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.prepare_tags.outputs.backend_image }}
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.prepare_tags.outputs.frontend_image }}
  deploy-to-staging:
    name: Deploy to Staging Server
    runs-on: self-hosted
    needs: build-and-publish
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          DEPLOY_PATH=/mnt/onedrive-data/family_heritage_staging
          mkdir -p $DEPLOY_PATH
          cp docker-compose.staging.yml $DEPLOY_PATH/docker-compose.staging.yml
          cd $DEPLOY_PATH
          echo "BACKEND_IMAGE=${{ needs.build-and-publish.outputs.backend_image }}" > .env
          echo "FRONTEND_IMAGE=${{ needs.build-and-publish.outputs.frontend_image }}" >> .env
          echo "POSTGRES_USER=family_heritage_user_staging" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD_STAGING }}" >> .env
          echo "POSTGRES_DB=family_heritage_db_staging" >> .env
          echo "VITE_API_BASE_URL=http://${{ secrets.STAGING_SERVER_IP }}:8081" >> .env
          echo "STAGING_SERVER_IP=${{ secrets.STAGING_SERVER_IP }}" >> .env
          docker compose -f docker-compose.staging.yml pull
          docker compose -f docker-compose.staging.yml up -d --remove-orphans