# .github/workflows/ci-pipeline.yml

name: CI Pipeline - Test and Validate PR

on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  validate-backend:
    name: Validate Backend (Test & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Run tests and build application
        working-directory: ./backend
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test/

  validate-frontend:
    name: Validate Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies, lint and build
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run build

  validate-compose-files:
    name: Validate Docker Compose Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config
      - name: Validate docker-compose.staging.yml
        run: docker compose -f docker-compose.staging.yml config
      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config