spring:
  profiles:
    default: local
  application:
    name: family-heritage-backend
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

server:
  address: 0.0.0.0

app:
  cors:
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allow-credentials: true
  jwt:
    access-expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: DEBUG
    web: DEBUG