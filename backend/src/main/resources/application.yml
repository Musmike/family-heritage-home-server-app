spring:
  profiles:
    default: dev
  application:
    name: family-heritage-backend
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  address: 0.0.0.0
  port: 8080

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allow-credentials: true
  jwt:
    secret: ThisIsADevJWTSecretKeyWithEnoughLength123ddfdfdfd
    expiration-ms: 3600000
